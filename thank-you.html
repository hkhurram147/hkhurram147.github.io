<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Hassan Khurram</title>
    <link rel="icon" href="images/uoft-logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      (function () {
        var theme = localStorage.getItem('theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <style>
        .thank-you-container {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8rem 2rem 3rem;
        }

        .thank-you-icon {
            width: 84px; height: 84px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.4rem;
            color: var(--success);
            background: rgba(22, 163, 74, .1);
            border: 1px solid rgba(22, 163, 74, .25);
            margin-bottom: 1.75rem;
            animation: rise-in .7s var(--ease-out) backwards, live-pulse 2.2s ease-out .8s infinite;
        }

        .thank-you-title {
            font-size: clamp(2rem, 5vw, 2.75rem);
            margin-bottom: 1rem;
            animation: rise-in .7s var(--ease-out) .1s backwards;
        }

        .thank-you-message {
            font-size: 1.1rem;
            max-width: 560px;
            margin-bottom: 2rem;
            color: var(--text-muted);
            animation: rise-in .7s var(--ease-out) .2s backwards;
        }

        .thank-you-container .btn {
            animation: rise-in .7s var(--ease-out) .3s backwards;
        }
    </style>
</head>
<body>
    <div class="scroll-progress" aria-hidden="true"></div>
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

    <header class="site-header scrolled" id="siteHeader">
        <nav class="nav-pill" aria-label="Primary">
            <a href="index.html" class="logo" aria-label="Home">HK</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#about">About</a></li>
                <li><a href="index.html#education">Education</a></li>
                <li><a href="index.html#experience">Experience</a></li>
                <li><a href="index.html#skills">Skills</a></li>
                <li><a href="index.html#projects">Projects</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="burger" id="burger" aria-label="Toggle menu" aria-expanded="false" aria-controls="navLinks">
                    <span></span><span></span>
                </button>
            </div>
        </nav>
    </header>

    <div class="thank-you-container">
        <div class="thank-you-icon">
            <i class="fas fa-check"></i>
        </div>
        <h1 class="thank-you-title">Thank You!</h1>
        <p class="thank-you-message">Your message has been sent successfully. I appreciate you reaching out and will get back to you as soon as possible.</p>
        <a href="index.html" class="btn primary">Return to Homepage <i class="fas fa-home"></i></a>
    </div>

    <footer class="site-footer">
        <div class="container footer-bottom">
            <p>&copy; <span class="footer-year">2026</span> Hassan Khurram. All rights reserved.</p>
            <div class="social-links">
                <a href="https://linkedin.com/in/hkhurram147" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="https://github.com/hkhurram147" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
