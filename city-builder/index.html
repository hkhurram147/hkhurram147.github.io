<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CityScape — City Map Builder</title>
<meta name="description" content="Design your own city map: draw roads, highways, zones, parks and water. Zoom, pan, save and export your city.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="logo">🏙️</span>
    <input id="cityName" type="text" value="New City" maxlength="32" spellcheck="false" aria-label="City name">
  </div>
  <div class="topbar-actions">
    <button id="btnUndo" title="Undo (Ctrl+Z)" disabled>↩ Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)" disabled>↪ Redo</button>
    <span class="sep"></span>
    <button id="btnZoomOut" title="Zoom out (-)">−</button>
    <span id="zoomLabel" title="Current zoom">100%</span>
    <button id="btnZoomIn" title="Zoom in (+)">+</button>
    <button id="btnFit" title="Fit map to screen (0)">Fit</button>
    <span class="sep"></span>
    <button id="btnGrid" class="active" title="Toggle grid (G)">Grid</button>
    <span class="sep"></span>
    <button id="btnSave" title="Save to browser (Ctrl+S)">Save</button>
    <button id="btnExport" title="Export map as PNG image">Export PNG</button>
    <button id="btnClear" class="danger" title="Clear the whole map">Clear</button>
  </div>
</header>

<aside id="toolbar">
  <div class="tool-group-label">Tools</div>
  <button class="tool" data-tool="pan"      title="Pan / move around (1). Tip: hold Space or drag with right mouse button anytime."><span class="swatch pan">✋</span>Pan</button>
  <button class="tool" data-tool="road"     title="Draw streets — click & drag (2)"><span class="swatch road"></span>Road</button>
  <button class="tool" data-tool="highway"  title="Draw highways — click & drag (3)"><span class="swatch highway"></span>Highway</button>
  <button class="tool" data-tool="res"      title="Residential zone — houses (4)"><span class="swatch res"></span>Homes</button>
  <button class="tool" data-tool="com"      title="Commercial zone — offices & shops (5)"><span class="swatch com"></span>Offices</button>
  <button class="tool" data-tool="ind"      title="Industrial zone — factories (6)"><span class="swatch ind"></span>Industry</button>
  <button class="tool" data-tool="park"     title="Parks & trees (7)"><span class="swatch park"></span>Park</button>
  <button class="tool" data-tool="water"    title="Water — rivers & lakes (8)"><span class="swatch water"></span>Water</button>
  <button class="tool" data-tool="erase"    title="Bulldoze / erase (9)"><span class="swatch erase">✕</span>Erase</button>

  <div class="tool-group-label">Brush</div>
  <div id="brushSizes">
    <button class="brush active" data-size="1" title="1×1 brush">1</button>
    <button class="brush" data-size="3" title="3×3 brush">3</button>
    <button class="brush" data-size="5" title="5×5 brush">5</button>
  </div>
</aside>

<main id="stage">
  <canvas id="map"></canvas>

  <div id="stats">
    <div class="stat"><span class="dot pop"></span><span id="statPop">0</span> residents</div>
    <div class="stat"><span class="dot jobs"></span><span id="statJobs">0</span> jobs</div>
    <div class="stat"><span class="dot rd"></span><span id="statRoads">0.0</span> km roads</div>
    <div class="stat"><span class="dot pk"></span><span id="statParks">0</span> parks</div>
  </div>

  <canvas id="minimap" width="160" height="160" title="Minimap — click to jump"></canvas>

  <div id="hint">
    <b>Drag</b> to draw &nbsp;·&nbsp; <b>Scroll</b> to zoom &nbsp;·&nbsp; <b>Right-drag / Space</b> to pan &nbsp;·&nbsp; <b>1–9</b> tools
    <button id="hintClose" title="Dismiss">✕</button>
  </div>

  <div id="toast"></div>
</main>

<script src="game.js"></script>
</body>
</html>
